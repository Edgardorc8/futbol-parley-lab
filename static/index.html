<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fútbol Parley Lab — Dark Mode Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:#0b1120; --panel:#111827; --card:#1e293b; --brd:#283548;
      --txt:#f1f5f9; --mut:#94a3b8; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --acc:#38bdf8;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Segoe UI,system-ui,sans-serif; background:var(--bg); color:var(--txt); font-size:13px; }
    /* Header */
    header { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:10px 18px; background:#0f172a; border-bottom:1px solid var(--brd); flex-wrap:wrap; }
    .brand { font-size:16px; font-weight:800; letter-spacing:-.2px; display:flex; align-items:center; gap:8px; white-space:nowrap; }
    .search { flex:1; min-width:180px; max-width:360px; background:#1e293b; border:1px solid var(--brd); color:var(--txt); border-radius:9px; padding:7px 12px; font-size:13px; }
    .hdr-right { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    button, input, select { background:#1e293b; color:var(--txt); border:1px solid var(--brd); border-radius:8px; padding:6px 11px; font-size:12.5px; }
    button { cursor:pointer; transition:.15s; }
    button:hover:not(:disabled) { border-color:var(--acc); }
    button.on, .side-btn.on { background:var(--acc); color:#020617; font-weight:700; border-color:var(--acc); }
    /* 3-Column Shell */
    .shell { display:grid; grid-template-columns:220px 1fr 330px; gap:16px; max-width:1600px; margin:0 auto; padding:16px; align-items:start; }
    @media (max-width:1180px) { .shell { grid-template-columns:200px 1fr; } .right-col { grid-column:1 / -1; position:static !important; } }
    @media (max-width:780px) { .shell { grid-template-columns:1fr; padding:10px; } }
    .left-col, .right-col { position:sticky; top:64px; display:flex; flex-direction:column; gap:12px; }
    .panel { background:var(--panel); border:1px solid var(--brd); border-radius:12px; padding:12px; }
    .panel-title { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); font-weight:700; margin:0 0 8px; }
    .side-btn { width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; margin-bottom:4px; background:transparent; border:1px solid transparent; border-radius:8px; color:var(--txt); }
    .side-btn:hover { background:#1e293b; }
    /* Center Cards */
    .date-strip { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
    .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-bottom:16px; }
    .card { background:var(--card); border:1px solid var(--brd); border-radius:12px; padding:14px; border-left:4px solid var(--ok); overflow-x:auto; }
    .card.hero { background:linear-gradient(135deg,#1e293b,#172554); border-left-color:var(--acc); margin-bottom:14px; }
    .card h2, .card h3 { margin:0 0 8px; font-size:14px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    table { width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; }
    th, td { padding:6px 6px; border-bottom:1px solid #283548; text-align:left; }
    th { color:var(--mut); font-weight:600; font-size:11px; }
    .mut { color:var(--mut); font-size:11.5px; }
    .tag { padding:2px 7px; border-radius:6px; font-size:10.5px; font-weight:700; display:inline-block; white-space:nowrap; }
    .ok { background:#065f46; color:#a7f3d0; }
    .warn { background:#78350f; color:#fde68a; }
    .bad { background:#7f1d1d; color:#fecaca; }
    .pos { color:#34d399; font-weight:700; }
    .neg { color:#f87171; font-weight:700; }
    .logo { width:20px; height:20px; object-fit:contain; vertical-align:middle; }
    .match { display:inline-flex; align-items:center; gap:5px; }
    .kpi { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; }
    .kpi > div { display:flex; flex-direction:column; gap:1px; }
    .kpi b { font-size:14.5px; }
    .pills { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
    .hide { display:none; }
    .alert-box { background:#7f1d1d; color:#fecaca; padding:8px 10px; border-radius:8px; font-size:11.5px; margin-bottom:8px; }
    .match-row { background:var(--card); border:1px solid var(--brd); border-radius:10px; padding:11px 13px; margin-bottom:10px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">⚽ Fútbol Parley Lab</div>
    <input class="search" id="busq" placeholder="🔍 Buscar equipo o liga..." oninput="renderActual()">
    <div class="hdr-right">
      <span id="api-status" class="tag warn">⏳ Conectando...</span>
      <input type="date" id="fecha" onchange="cargar(false)">
      <button onclick="cargar(true)">⟳ Actualizar</button>
      <button onclick="descargarExcel()">⬇ Excel</button>
    </div>
  </header>

  <div class="shell">
    <!-- SIDEBAR IZQUIERDO -->
    <aside class="left-col">
      <div class="panel">
        <div class="panel-title">Vistas</div>
        <button id="t-res" class="side-btn on" onclick="tab('res')"><span>🎯 Menú de Apuestas</span></button>
        <button id="t-rk" class="side-btn" onclick="tab('rk')"><span>🏆 Ranking EV</span></button>
        <button id="t-pr" class="side-btn" onclick="tab('pr')"><span>👟 Player Props</span></button>
        <button id="t-his" class="side-btn" onclick="tab('his')"><span>📊 Historial & ROI</span></button>
        <button id="t-cuo" class="side-btn" onclick="tab('cuo')"><span>⚙️ Cuotas Casa</span></button>
      </div>
      <div class="panel">
        <div class="panel-title">Ligas Europeas</div>
        <div id="side-ligas" class="mut">Cargando...</div>
      </div>
    </aside>

    <!-- CONTENIDO CENTRAL -->
    <main>
      <div class="date-strip">
        <button onclick="moverDia(-1)">◀ Ayer</button>
        <button onclick="moverDia(0)">Hoy</button>
        <button onclick="moverDia(1)">📅 Mañana ▶</button>
        <span id="upd" class="mut" style="margin-left:auto"></span>
      </div>
      <div id="loading" class="mut" style="margin-bottom:12px">Cargando jornada europea y cuotas reales...</div>
      <section id="v-res"></section>
      <section id="v-rk" class="hide"></section>
      <section id="v-pr" class="hide"></section>
      <section id="v-his" class="hide"></section>
      <section id="v-cuo" class="hide"></section>
    </main>

    <!-- SIDEBAR DERECHO (CARRITO + BANCA + ALERTAS) -->
    <aside class="right-col">
      <div class="panel" id="p-carrito"></div>
      <div class="panel" id="p-banca"></div>
      <div class="panel" id="p-alertas"></div>
      <div class="panel" id="p-tickets"></div>
    </aside>
  </div>

  <script>
    let DATA = null, TAB = "res", LIGA_FILTRO = "TODAS", RK_FILTRO = "TODOS", PR_FILTRO = "TODOS", PICKS = new Set();
    let HIST = null, CAL_Y = new Date().getFullYear(), CAL_M = new Date().getMonth(), CAL_SEL = "", HIS_MKT = "TODOS", HIS_LIGA = "TODAS", SOLO_LIMPIOS = false;
    const $ = id => document.getElementById(id);
    const pct = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
    const bloq = e => e.includes("BLOQUEADO") || e.includes("CUARENTENA");
    const cls = e => e.startsWith("LUZ") ? "ok" : (e.startsWith("AVISO") ? "warn" : "bad");
    const MERCADOS_DESACTIVADOS = new Set(["Total UNDER 3.5", "Hándicap +1.5", "Total OVER 2.5"]);
    const LIGA_LOGO_ID = { "eng.1": 23, "esp.1": 15, "ita.1": 12, "ger.1": 10, "fra.1": 9, "uefa.champions": 2, "uefa.europa": 2310 };
    const ligaIco = slug => LIGA_LOGO_ID[slug] ? `<img class="logo" src="https://a.espncdn.com/i/leaguelogos/soccer/500-dark/${LIGA_LOGO_ID[slug]}.png" alt="${slug}">` : "⚽";
    const LIGA_ICON = new Proxy({}, { get: (_, k) => ligaIco(k) });
    const mLogo = g => `<span class="match">${g.home.logo ? `<img class="logo" src="${g.home.logo}">` : ""}<b>${g.home.nombre}</b> <span class="mut">vs</span> ${g.away.logo ? `<img class="logo" src="${g.away.logo}">` : ""}<b>${g.away.nombre}</b></span>`;

    function yaPasoHora(g) {
      if (g.inicio_iso) return new Date(g.inicio_iso) <= new Date();
      if (!DATA?.fecha || !g.hora) return false;
      const m = g.hora.match(/(\d+):(\d+)\s*(AM|PM)/i);
      if (!m) return false;
      let h = parseInt(m[1], 10);
      const min = parseInt(m[2], 10), pm = m[3].toUpperCase() === "PM";
      if (pm && h !== 12) h += 12;
      if (!pm && h === 12) h = 0;
      return new Date(`${DATA.fecha}T${String(h).padStart(2, "0")}:${String(min).padStart(2, "0")}:00-04:00`) <= new Date();
    }
    const jugado = g => /full time|final|ft|halftime|first half|second half|in progress|extra time|penalties/i.test(g.estado || "") || yaPasoHora(g);

    function moverDia(delta) {
      const d = new Date(Date.now() - 4 * 3600e3 + delta * 86400e3).toISOString().slice(0, 10);
      $("fecha").value = d;
      cargar(false);
    }

    function tab(t) {
      TAB = t;
      ["res", "rk", "pr", "his", "cuo"].forEach(k => {
        $("v-" + k).classList.toggle("hide", k !== t);
        $("t-" + k).classList.toggle("on", k === t);
      });
      if (t === "his") cargarHistorial(false);
      if (t === "cuo") cargarCuotas();
      renderActual();
    }

    function partidosFiltrados() {
      if (!DATA) return [];
      const q = ($("busq").value || "").toLowerCase().trim();
      return DATA.partidos.filter(a => {
        if (LIGA_FILTRO !== "TODAS" && a.g.liga !== LIGA_FILTRO) return false;
        if (q && !`${a.g.home.nombre} ${a.g.away.nombre} ${a.g.liga_nombre}`.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    async function cargar(refrescar = false) {
      $("loading").style.display = "block";
      const f = $("fecha").value;
      const r = await fetch(`/api/jornada?refrescar=${refrescar}` + (f ? `&fecha=${f}` : ""));
      DATA = await r.json();
      $("fecha").value = DATA.fecha;
      $("upd").textContent = `Actualizado ${DATA.actualizado} VET · ${DATA.partidos.length} partidos`;
      $("loading").style.display = "none";
      const conReal = DATA.partidos.filter(a => a.sel.some(s => !s.cuota_est)).length;
      $("api-status").className = "tag " + (conReal > 0 ? "ok" : "warn");
      $("api-status").textContent = conReal > 0 ? `🟢 API Cuotas Reales (${conReal}/${DATA.partidos.length})` : `🟡 Modo Estimado (${DATA.partidos.length})`;
      renderSidebarLigas();
      renderActual();
      renderCarrito();
      cargarTicketsGuardados();
    }

    function renderActual() {
      if (!DATA) return;
      renderResumen();
      renderRanking();
      renderProps();
      renderAlertas();
    }

    function renderSidebarLigas() {
      const ligas = [...new Map(DATA.partidos.map(a => [a.g.liga, a.g.liga_nombre])).entries()];
      $("side-ligas").innerHTML = `
        <button class="side-btn ${LIGA_FILTRO === 'TODAS' ? 'on' : ''}" onclick="LIGA_FILTRO='TODAS';renderSidebarLigas();renderActual()">
          <span>🌍 Todas</span><span class="mut">${DATA.partidos.length}</span>
        </button>
        ${ligas.map(([slug, nom]) => {
          const cnt = DATA.partidos.filter(a => a.g.liga === slug).length;
          return `<button class="side-btn ${LIGA_FILTRO === slug ? 'on' : ''}" onclick="LIGA_FILTRO='${slug}';renderSidebarLigas();renderActual()">
            <span style="display:flex;align-items:center;gap:6px">${LIGA_ICON[slug]} ${nom}</span><span class="mut">${cnt}</span>
          </button>`;
        }).join("")}`;
    }

    function togglePick(pid) {
      PICKS.has(pid) ? PICKS.delete(pid) : PICKS.add(pid);
      renderActual();
      renderCarrito();
    }

    function renderResumen() {
      const listaP = partidosFiltrados();
      const mapG = Object.fromEntries(DATA.partidos.map(a => [a.g.partido, a.g]));
      const menu = DATA.menu_apuestas || {};
      const fijas = (menu.fijas || []).filter(x => !mapG[x.partido] || !jugado(mapG[x.partido]));

      const renderComboCard = (titulo, color, badge, obj) => {
        if (!obj || !obj.patas || !obj.patas.length) {
          return `<div class="card" style="border-left-color:${color}"><h3>${titulo} <span class="tag warn">${badge}</span></h3><p class="mut">Sin suficientes picks +EV con cuota real.</p></div>`;
        }
        return `<div class="card" style="border-left-color:${color}">
          <h3>${titulo} <span class="tag warn">${badge}</span></h3>
          <table><thead><tr><th>✓</th><th>Partido</th><th>Selección</th><th>Cuota</th><th>Prob.</th></tr></thead>
          <tbody>${obj.patas.map(x => {
            const g = mapG[x.partido], pid = x.id || (g ? `${g.id}|${x.mercado}` : "");
            return `<tr><td><input type="checkbox" ${x.cuota_est ? "disabled title='⚠️ Cuota estimada'" : ""} ${PICKS.has(pid) ? "checked" : ""} onchange="togglePick('${pid}')"></td>
              <td>${g ? mLogo(g) : `<b>${x.partido}</b>`}<div class="mut">${x.hora}</div></td>
              <td><b>${x.seleccion}</b></td><td>${x.cuota.toFixed(2)}</td><td class="pos">${pct(x.prob)}</td></tr>`;
          }).join("")}</tbody></table>
          <div class="kpi">
            <div><span class="mut">Cuota</span><b>${obj.cuota.toFixed(2)}</b></div>
            <div><span class="mut">Prob. Adj.</span><b class="pos">${pct(obj.prob_adj)}</b></div>
            <div><span class="mut">EV Real</span><b class="${obj.ev > 0 ? 'pos' : 'neg'}">${(obj.ev * 100).toFixed(1)}%</b></div>
            <div><span class="mut">Stake</span><b>${obj.stake_pct}%</b></div>
          </div>
        </div>`;
      };

      const fijasCard = `<div class="card" style="border-left-color:#10b981">
        <h3>🟢 Fijas — Riesgo Bajo <span class="tag ok">0.25x Kelly</span></h3>
        ${fijas.length ? `<table><thead><tr><th>✓</th><th>Hora</th><th>Partido</th><th>Selección</th><th>Cuota</th><th>Prob.</th></tr></thead>
        <tbody>${fijas.map(x => {
          const g = mapG[x.partido], pid = x.id || (g ? `${g.id}|${x.mercado}` : "");
          return `<tr><td><input type="checkbox" ${x.cuota_est ? "disabled title='⚠️ Cuota estimada'" : ""} ${PICKS.has(pid) ? "checked" : ""} onchange="togglePick('${pid}')"></td>
            <td>${x.hora}</td><td>${g ? mLogo(g) : `<b>${x.partido}</b>`}</td>
            <td><b>${x.seleccion}</b></td><td>${x.cuota.toFixed(2)}</td><td class="pos">${pct(x.prob)}</td></tr>`;
        }).join("")}</tbody></table>` : `<p class="mut">Sin fijas +EV hoy. Prueba <b>📅 Mañana</b>.</p>`}
      </div>`;

      // Partidos horizontales con checkboxes para armador manual
      const prox = listaP.filter(a => !jugado(a.g));
      const filasPartidos = prox.map(a => {
        const g = a.g, p = a.proy;
        const sels = a.sel.filter(s => !MERCADOS_DESACTIVADOS.has(s.tipo));
        return `<div class="match-row">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px">
            <div>${LIGA_ICON[g.liga]} ${mLogo(g)}</div>
            <span class="mut">${g.liga_nombre} · <b>${g.hora}</b> · λ: ${p.cal_h}-${p.cal_a} (${p.total})</span>
          </div>
          <table><thead><tr><th>✓</th><th>Mercado</th><th>Selección</th><th>Cuota</th><th>Prob.</th><th>EV</th><th>Estado</th></tr></thead>
          <tbody>${sels.map(s => {
            const pid = `${g.id}|${s.tipo}`;
            return `<tr>
              <td>${s.cuota_est ? `<span title="Cuota estimada">⚠️</span>` : `<input type="checkbox" ${PICKS.has(pid) ? "checked" : ""} onchange="togglePick('${pid}')">`}</td>
              <td>${s.tipo}</td><td><b>${s.seleccion}</b></td>
              <td>${s.cuota.toFixed(2)}${s.cuota_est ? "*" : ""}</td><td class="pos">${pct(s.prob)}</td>
              <td class="${s.ventaja > 0 ? 'pos' : 'neg'}">${(s.ventaja * 100).toFixed(1)}%</td>
              <td><span class="tag ${cls(s.estado)}">${s.estado.split(":")[0]}</span></td>
            </tr>`;
          }).join("")}</tbody></table>
        </div>`;
      }).join("");

      $("v-res").innerHTML = `
        <div class="grid2">
          ${fijasCard}
          ${renderComboCard("🟡 Dobles — Riesgo Medio", "#eab308", "0.15x Kelly", menu.dobles)}
          ${renderComboCard("🟠 Triples — Riesgo Alto", "#f97316", "⚠️ 0.05x Kelly", menu.triples)}
          ${renderComboCard("🔴 Cuádruples — Riesgo Muy Alto", "#ef4444", "⚠️ 0.02x Kelly", menu.cuadruples)}
        </div>
        <h3 style="margin:6px 0 10px;font-size:14px">📋 Partidos y Análisis (${prox.length} próximos)</h3>
        ${filasPartidos || '<div class="card"><p class="mut">Sin partidos próximos para este filtro. Prueba <b>📅 Mañana</b>.</p></div>'}`;
    }

    function renderRanking() {
      const prox = partidosFiltrados().filter(a => !jugado(a.g));
      const todas = prox.flatMap(a => a.sel.map(s => ({ a, s, id: a.g.id + "|" + s.tipo })));
      todas.sort((x, y) => (bloq(x.s.estado) - bloq(y.s.estado)) || ((y.s.ev_ajustado ?? y.s.ventaja) - (x.s.ev_ajustado ?? x.s.ventaja)));
      const tipos = ["TODOS", "Doble Oportunidad", "Ambos Marcan", "Total OVER 1.5", "Total UNDER 2.5", "Ganador (2 Goles)"];
      const lista = RK_FILTRO === "TODOS" ? todas : todas.filter(x => x.s.tipo === RK_FILTRO);
      $("v-rk").innerHTML = `
        <div class="pills">${tipos.map(t => `<button class="${RK_FILTRO === t ? 'on' : ''}" onclick="RK_FILTRO='${t}';renderRanking()">${t}</button>`).join("")}</div>
        <div class="card"><h3>🏆 Ranking Completo por EV Ajustado (${lista.length})</h3>
        <table><thead><tr><th>✓</th><th>Hora</th><th>Partido</th><th>Mercado</th><th>Selección</th><th>Cuota</th><th>Prob.</th><th>EV</th><th>Estado</th></tr></thead>
        <tbody>${lista.map(x => `<tr>
          <td>${x.s.cuota_est ? "⚠️" : `<input type="checkbox" ${PICKS.has(x.id) ? "checked" : ""} onchange="togglePick('${x.id}')">`}</td>
          <td>${x.a.g.hora}</td><td>${mLogo(x.a.g)}</td><td>${x.s.tipo}</td><td><b>${x.s.seleccion}</b></td>
          <td>${x.s.cuota.toFixed(2)}</td><td class="pos">${pct(x.s.prob)}</td>
          <td class="${x.s.ventaja > 0 ? 'pos' : 'neg'}">${(x.s.ventaja * 100).toFixed(1)}%</td>
          <td><span class="tag ${cls(x.s.estado)}">${x.s.estado.split(":")[0]}</span></td>
        </tr>`).join("")}</tbody></table></div>`;
    }

    function renderProps() {
      const prox = partidosFiltrados().filter(a => !jugado(a.g));
      const all = prox.flatMap(a => a.props || []).sort((x, y) => y.prob - x.prob);
      const cats = [["TODOS", "Todos"], ["PORTEROS", "🧤 Porteros"], ["A PUERTA", "🎯 A Puerta"], ["REMATES", "⚡ Remates"]];
      const sec = (k, tit) => {
        const sub = all.filter(p => p.cat === k).slice(0, 20);
        return `<div class="card" style="margin-bottom:12px"><h3>${tit} <span class="mut">NB2 · ${sub.length}</span></h3>
        <table><thead><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>Partido</th><th>Prop</th><th>Prom.</th><th>Prob.</th></tr></thead>
        <tbody>${sub.map((p, i) => `<tr><td>${i + 1}</td><td><b>${p.jugador}</b></td><td>${p.logo ? `<img class="logo" src="${p.logo}"> ` : ""}${p.equipo}</td>
          <td>${p.partido}</td><td><b>${p.prop}</b></td><td class="mut">${p.promedio}</td><td class="pos">${pct(p.prob)}</td></tr>`).join("") || '<tr><td colspan="7" class="mut">Sin datos.</td></tr>'}</tbody></table></div>`;
      };
      $("v-pr").innerHTML = `<div class="pills">${cats.map(([k, l]) => `<button class="${PR_FILTRO === k ? 'on' : ''}" onclick="PR_FILTRO='${k}';renderProps()">${l}</button>`).join("")}</div>` +
        (PR_FILTRO === "TODOS" ? sec("PORTEROS", "🧤 Porteros (Atajadas)") + sec("A PUERTA", "🎯 Remates a Puerta") + sec("REMATES", "⚡ Remates Totales") : sec(PR_FILTRO, PR_FILTRO));
    }

    function validarParley(sel, cuota, probAdj) {
      const err = [];
      if (sel.length > 4) err.push("Máximo 4 patas.");
      if (new Set(sel.map(x => x.a.g.id)).size < sel.length) err.push("Máx. 1 pata por partido.");
      if (sel.filter(x => ["uefa.champions", "uefa.europa"].includes(x.a.g.liga)).length > 3) err.push("Máx. 3 patas UCL/UEL.");
      if (sel.some(x => x.s.cuota_est)) err.push("Contiene cuota estimada (⚠️).");
      if (sel.some(x => MERCADOS_DESACTIVADOS.has(x.s.tipo))) err.push("Mercado desactivado.");
      if (sel.length && (probAdj * cuota - 1) > 0.30) err.push("SOBRECONFIANZA: EV > 30%.");
      return err;
    }

    function renderCarrito() {
      if (!DATA) return;
      const todas = DATA.partidos.flatMap(a => a.sel.map(s => ({ a, s, id: a.g.id + "|" + s.tipo })));
      const sel = todas.filter(x => PICKS.has(x.id) && !jugado(x.a.g));
      const cuota = sel.reduce((c, x) => c * x.s.cuota, 1);
      const corrPen = sel.length > 1 ? Math.pow(0.92, sel.length - 1) : 1.0;
      const prob = sel.reduce((p, x) => p * x.s.prob, 1) * corrPen;
      const bk = parseFloat(localStorage.getItem("fut_bankroll") || "100");
      const ev = sel.length ? prob * cuota - 1 : 0;
      const kMult = sel.length <= 1 ? 0.25 : sel.length === 2 ? 0.15 : sel.length === 3 ? 0.05 : 0.02;
      const kellyQ = ev > 0 ? Math.min(0.05, (ev / Math.max(0.01, cuota - 1)) * kMult) : 0;
      const stake = bk * kellyQ;
      const err = validarParley(sel, cuota, prob);

      $("p-carrito").innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div class="panel-title" style="margin:0">🎟️ Carrito (${sel.length})</div>
          ${sel.length ? `<button onclick="PICKS.clear();renderActual();renderCarrito()" style="padding:3px 7px;font-size:11px">Limpiar</button>` : ""}
        </div>
        ${err.length ? `<div class="alert-box">${err.map(e => "• " + e).join("<br>")}</div>` : ""}
        ${sel.length ? sel.map(x => `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--brd);font-size:12px">
          <div><b>${x.a.g.partido}</b><div class="mut">${x.s.seleccion} @${x.s.cuota.toFixed(2)}</div></div>
          <button onclick="togglePick('${x.id}')" style="padding:2px 6px">✕</button>
        </div>`).join("") + `
        <div class="kpi">
          <div><span class="mut">Cuota</span><b>${cuota.toFixed(2)}</b></div>
          <div><span class="mut">Prob.</span><b class="pos">${pct(prob)}</b></div>
          <div><span class="mut">EV</span><b class="${ev > 0 ? 'pos' : 'neg'}">${(ev * 100).toFixed(1)}%</b></div>
          <div><span class="mut">${kMult}x Kelly</span><b>$${stake.toFixed(2)}</b></div>
        </div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <input type="number" id="tk-stake" value="${Math.max(0.5, +(stake || 2)).toFixed(2)}" step="0.5" style="width:75px" title="Stake $">
          <input id="tk-notas" placeholder="Nota..." style="flex:1">
        </div>
        <button onclick="guardarTicketActual()" ${err.length ? 'disabled style="width:100%;margin-top:8px;opacity:.4"' : 'style="width:100%;margin-top:8px;background:var(--ok);color:#000;font-weight:700"'}>💾 Guardar Ticket</button>`
        : '<p class="mut">Marca checkboxes en los partidos para armar tu apuesta.</p>'}`;

      $("p-banca").innerHTML = `
        <div class="panel-title">💰 Resumen de Banca</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span class="mut">Bankroll ($)</span>
          <input type="number" value="${bk}" style="width:85px" onchange="localStorage.setItem('fut_bankroll',this.value);renderCarrito()">
        </div>
        <div class="mut">Cap diario máx (5%): <b>$${(bk * 0.05).toFixed(2)}</b></div>`;
    }

    function renderAlertas() {
      const estCnt = DATA.partidos.filter(a => a.sel.some(s => s.cuota_est)).length;
      $("p-alertas").innerHTML = `
        <div class="panel-title">🔔 Alertas del Sistema</div>
        <div class="mut">${estCnt ? `⚠️ ${estCnt} partidos tienen mercados secundarios con cuota estimada.` : "🟢 Cobertura completa de cuotas reales."}</div>`;
    }

    async function guardarTicketActual() {
      const todas = DATA.partidos.flatMap(a => a.sel.map(s => ({ a, s, id: a.g.id + "|" + s.tipo })));
      const sel = todas.filter(x => PICKS.has(x.id) && !jugado(x.a.g));
      if (!sel.length) return;
      const cuota = sel.reduce((c, x) => c * x.s.cuota, 1);
      const prob = sel.reduce((p, x) => p * x.s.prob, 1) * Math.pow(0.92, Math.max(0, sel.length - 1));
      const bk = parseFloat(localStorage.getItem("fut_bankroll") || "100");
      const r = await fetch("/api/tickets", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          fecha: DATA.fecha, bankroll: bk, stake: parseFloat($("tk-stake").value) || 2,
          cuota_total: +cuota.toFixed(3), prob_conjunta: +prob.toFixed(4), notas: $("tk-notas").value.trim(),
          patas: sel.map(x => ({ hora: x.a.g.hora, partido: x.a.g.partido, mercado: x.s.tipo, seleccion: x.s.seleccion, cuota: x.s.cuota })),
        }),
      });
      if (!r.ok) { alert("⚠️ " + ((await r.json()).detail || "Error al guardar")); return; }
      PICKS.clear(); renderActual(); renderCarrito(); cargarTicketsGuardados();
    }

    async function cargarTicketsGuardados() {
      const d = await (await fetch("/api/tickets")).json();
      $("p-tickets").innerHTML = `
        <div class="panel-title">🗂️ Tickets (${d.total}) · <span class="${d.beneficio >= 0 ? 'pos' : 'neg'}">${d.beneficio >= 0 ? '+' : ''}$${d.beneficio.toFixed(2)}</span></div>
        ${d.tickets.slice(0, 6).map(t => `<div style="padding:5px 0;border-bottom:1px solid var(--brd);font-size:11.5px">
          <div style="display:flex;justify-content:space-between"><b>${t.fecha} · @${t.cuota_total.toFixed(2)} ($${t.stake})</b><span class="tag ${t.resultado==='GANADA'?'ok':t.resultado==='PERDIDA'?'bad':'warn'}">${t.resultado}</span></div>
          <div class="mut">${t.patas.map(p => `${p.partido}: ${p.seleccion}`).join(" · ")}</div>
          <div style="margin-top:3px;display:flex;gap:4px">
            <button onclick="setEstadoTicket(${t.id},'GANADA')" style="padding:1px 6px">✓</button>
            <button onclick="setEstadoTicket(${t.id},'PERDIDA')" style="padding:1px 6px">✕</button>
            <button onclick="delTicket(${t.id})" style="padding:1px 6px">🗑</button>
          </div>
        </div>`).join("") || '<span class="mut">Sin tickets guardados.</span>'}`;
    }
    async function setEstadoTicket(id, resultado) { await fetch("/api/tickets/" + id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ resultado }) }); cargarTicketsGuardados(); }
    async function delTicket(id) { await fetch("/api/tickets/" + id, { method: "DELETE" }); cargarTicketsGuardados(); }

    async function cargarCuotas() {
      const c = await (await fetch("/api/cuotas?fecha=" + $("fecha").value)).json();
      const campos = ["ml_local", "dc_1x", "dc_x2", "under35", "over15"];
      const prox = (DATA?.partidos || []).filter(a => !jugado(a.g));
      $("v-cuo").innerHTML = `<div class="card hero"><h2>⚙️ Cuotas Reales Manuales (CSV)</h2>
        <table><thead><tr><th>Hora</th><th>Partido</th>${campos.map(k => `<th>${k}</th>`).join("")}</tr></thead>
        <tbody>${prox.map(a => `<tr><td>${a.g.hora}</td><td><b>${a.g.partido}</b></td>
          ${campos.map(k => `<td><input data-p="${a.g.partido}" data-k="${k}" value="${(c[a.g.partido] || {})[k] ?? ''}" style="width:66px"></td>`).join("")}</tr>`).join("")}</tbody></table>
        <p><button onclick="guardarCuotasCasa()" style="background:var(--ok);color:#000;font-weight:700">💾 Guardar y Recalcular</button></p></div>`;
    }
    async function guardarCuotasCasa() {
      const datos = {};
      document.querySelectorAll("#v-cuo input").forEach(i => { datos[i.dataset.p] = datos[i.dataset.p] || {}; if (i.value.trim()) datos[i.dataset.p][i.dataset.k] = i.value.trim(); });
      await fetch("/api/cuotas?fecha=" + $("fecha").value, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) });
      cargar(false);
    }

    async function cargarHistorial(verif) {
      HIST = await (await fetch(`/api/historial?verificar=${verif}&solo_limpios=${SOLO_LIMPIOS}`)).json();
      pintarHistorial();
    }
    function pintarHistorial() {
      const h = HIST; if (!h) return;
      const pf = h.por_fecha || {};
      const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
      const startDay = (new Date(CAL_Y, CAL_M, 1).getDay() + 6) % 7, days = new Date(CAL_Y, CAL_M + 1, 0).getDate();
      let cells = "<div></div>".repeat(startDay);
      for (let d = 1; d <= days; d++) {
        const iso = `${CAL_Y}-${String(CAL_M + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`, info = pf[iso];
        const bg = !info ? "#0f172a" : (info.beneficio_u > 0 ? "#064e3b" : info.beneficio_u < 0 ? "#7f1d1d" : "#1e3a5f");
        cells += `<div onclick="CAL_SEL=(CAL_SEL==='${iso}'?'':'${iso}');pintarHistorial()" style="cursor:pointer;background:${bg};border:${CAL_SEL===iso?'2px solid var(--acc)':'1px solid var(--brd)'};border-radius:7px;padding:5px;min-height:48px;font-size:11px">
          <div style="display:flex;justify-content:space-between"><b>${d}</b>${info ? `<span class="mut">${info.ganadas}G/${info.perdidas}P</span>` : ""}</div>
          ${info ? `<div style="font-weight:700;color:${info.beneficio_u>=0?'#6ee7b7':'#fca5a5'}">${info.beneficio_u>=0?'+':''}${info.beneficio_u}u</div>` : ""}</div>`;
      }
      $("v-his").innerHTML = `
        <div class="card hero">
          <h2>📊 Historial & Backtesting
            <span style="display:flex;gap:6px">
              <button class="${SOLO_LIMPIOS ? 'on' : ''}" onclick="SOLO_LIMPIOS=!SOLO_LIMPIOS;cargarHistorial(false)">Muestra Limpia (${h.muestra_limpia || 0}/100)</button>
              <button onclick="cargarHistorial(true)">⟳ Verificar ESPN</button>
            </span>
          </h2>
          <div class="kpi">
            <div><span class="mut">Total</span><b>${h.total}</b></div>
            <div><span class="mut">G/P/Pend</span><b>${h.ganadas}/${h.perdidas}/${h.pendientes}</b></div>
            <div><span class="mut">Acierto</span><b class="pos">${pct(h.acierto)}</b></div>
            <div><span class="mut">ROI</span><b class="${(h.roi||0)>=0?'pos':'neg'}">${pct(h.roi)}</b></div>
            <div><span class="mut">Max DD</span><b class="neg">-${(h.max_dd_u||0).toFixed(2)}u</b></div>
            <div><span class="mut">Brier M/Mkt</span><b>${h.brier!=null?h.brier.toFixed(3):'—'}/${h.brier_mercado!=null?h.brier_mercado.toFixed(3):'—'}</b></div>
            <div><span class="mut">CLV</span><b>${h.clv_medio!=null?(h.clv_medio*100).toFixed(2)+'%':'—'}</b></div>
          </div>
        </div>
        <div class="card" style="margin-bottom:12px"><h3>📈 Equity Curve</h3><canvas id="eq-chart" height="65"></canvas></div>
        ${(h.por_mercado||[]).length ? `<div class="card" style="margin-bottom:12px"><h3>🔬 Diagnóstico por Mercado (IC 95% Wilson)</h3>
          <table><thead><tr><th>Mercado</th><th>G/P</th><th>Mod.</th><th>Real</th><th>IC 95%</th><th>ROI</th><th>Muestra</th></tr></thead>
          <tbody>${h.por_mercado.map(m => `<tr><td><b>${m.mercado}</b></td><td>${m.ganadas}/${m.perdidas}</td><td>${pct(m.prob_esperada)}</td><td><b>${pct(m.acierto)}</b></td>
            <td class="mut">${m.ic_lo!=null?`[${pct(m.ic_lo)},${pct(m.ic_hi)}]`:'—'}</td><td class="${(m.roi||0)>=0?'pos':'neg'}">${m.roi!=null?(m.roi*100).toFixed(1)+'%':'—'}</td>
            <td><span class="tag ${(m.dec||0)>=100?'ok':(m.dec||0)>=30?'warn':'bad'}">${m.muestra}</span></td></tr>`).join("")}</tbody></table></div>` : ""}
        <div class="card"><h3><span>📅 ${meses[CAL_M]} ${CAL_Y}</span><span><button onclick="CAL_M--;if(CAL_M<0){CAL_M=11;CAL_Y--;}pintarHistorial()">◀</button> <button onclick="CAL_M++;if(CAL_M>11){CAL_M=0;CAL_Y++;}pintarHistorial()">▶</button></span></h3>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${cells}</div></div>`;
      if (window.Chart && $("eq-chart")) {
        let ac = 0; const pts = [], lbs = [];
        [...(h.picks || [])].reverse().forEach((r, i) => { if (r.resultado==="GANADA") ac+=(r.cuota-1); else if (r.resultado==="PERDIDA") ac-=1; else return; lbs.push(`#${i+1}`); pts.push(+ac.toFixed(2)); });
        new Chart($("eq-chart"), { type:"line", data:{ labels:lbs, datasets:[{ data:pts, borderColor:"#38bdf8", backgroundColor:"rgba(56,189,248,0.12)", fill:true, tension:.25, pointRadius:1 }] }, options:{ plugins:{legend:{display:false}}, scales:{x:{ticks:{color:"#94a3b8",maxTicksLimit:8}}, y:{ticks:{color:"#94a3b8"}}} } });
      }
    }

    function descargarExcel() { window.location = "/api/excel" + ($("fecha").value ? `?fecha=${$("fecha").value}` : ""); }
    cargar(false);
  </script>
</body>
</html>
